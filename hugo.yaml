#         delimiters:
#           block: [['\[', '\]'], ['$$', '$$']]
#           inline: [['\(', '\)']]
#         enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: getting-started
      name: Getting started
      pageRef: /getting-started
      weight: 1
    - identifier: fundraising
      name: Fundraising
      pageRef: /fundraising
      weight: 2
    - name: Search
      weight: 6
      params:
        type: search


  # sidebar:
