# Configuration
title: "Movember Wiki"
baseURL: "https://wiki.movember.com/"
theme: "hextra"

enableRobotsTXT: false
# Parse Git commit
# enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true

# services:
#   googleAnalytics:
#     ID: G-MEASUREMENT_ID

outputs:
  home: [html, llms]
  page: [html]
  section: [html, rss]

defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1
    # title: Hextra
