  #   languageCode: zh-CN
  #   weight: 4
  #   title: Hextra

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

  # workspace: hugo.work
  # imports:
  #   - path: github.com/imfing/hextra

# markup:
#   highlight:
